trajectory_log_path: "trajectories/midas_trajectories.jsonl"

# Caps applied in demo/production to prevent runaway hosted-model costs.
demo:
  max_tokens_per_request: 3000
  max_repair_attempts: 2

providers:
  groq:
    type: groq
    settings: {}

  openai:
    type: openai
    settings: {}          # API key loaded from OPENAI_API_KEY env var

  openrouter:
    type: openai
    settings:
      base_url: https://openrouter.ai/api/v1
      default_headers: null

  ollama_local:
    settings:
      host: http://localhost:11434
      request_timeout_s: 300
    type: ollama

services:
  marker:
    settings:
      output_format: json
      use_llm: true
      force_ocr: true
      redo_inline_math: true
      strip_existing_ocr: true
      disable_image_extraction: true
      debug: false
      llm_service: openai
      openai:
        model: gpt-4.1-mini
        base_url: https://api.openai.com/v1
        image_format: png
        timeout: 120
    type: marker

tasks:
  # ── Hosted OpenAI tasks ───────────────────────────────────────────────────
  reasoning:
    provider: openai
    model: gpt-4.1-mini
    params:
      temperature: 0.2
      max_tokens: 2500
    prompt_ref: reasoning/solve@v2
    timeout: 120

  reasoning_repair:
    provider: openai
    model: gpt-4.1-mini
    params:
      temperature: 0.2
      max_tokens: 2500
    prompt_ref: reasoning/repair@v1
    timeout: 120

  verification:
    provider: openai
    model: gpt-4.1-mini
    params:
      temperature: 0.1
      max_tokens: 5000
    prompt_ref: codegen/baseline_codegen@v7
    timeout: 120
    max_repair_attempts: 3
    confidence_threshold: 0.95
    min_acceptable_confidence: 0.7
    repair_temperature: 0.2
    execution_timeout: 300
    memory_limit_mb: 512

  explain_step:
    provider: openai
    model: gpt-4.1-nano
    params:
      temperature: 0.3
      max_tokens: 700
    prompt_ref: reasoning/explain_step@v1
    timeout: 120

  group_problems:
    provider: openai
    model: gpt-4.1-mini
    params:
      temperature: 0.1
      max_tokens: 1500
    prompt_ref: vision/group_problems@v3
    timeout: 120

  vision:
    provider: ollama_local
    model: qwen2.5vl:7b
    params:
      max_tokens: 1000
      seed:
      temperature: 0.1
      top_p: 0.95
    prompt_ref: vision/analyze@v1
    timeout: 300

  validation:
    provider: openai
    model: gpt-4.1-mini
    params:
      temperature: 0.1
      max_tokens: 200
    prompt_ref: vision/validate@v1
    timeout: 120

  json_repair:
    provider: openai
    model: gpt-4.1-nano
    params:
      temperature: 0.1
      max_tokens: 1200
    prompt_ref: vision/repair_json@v1
    timeout: 120
