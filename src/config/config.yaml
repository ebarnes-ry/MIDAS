trajectory_log_path: "trajectories/midas_trajectories.jsonl"

# Caps applied in demo/production to prevent runaway Groq costs.
demo:
  max_tokens_per_request: 3000
  max_repair_attempts: 2

providers:
  groq:
    type: groq
    settings: {}          # API key loaded from GROQ_API_KEY env var

  ollama_local:
    settings:
      host: http://localhost:11434
      request_timeout_s: 300
    type: ollama

services:
  marker:
    settings:
      output_format: json
      use_llm: true
      force_ocr: true
      redo_inline_math: true
      strip_existing_ocr: true
      disable_image_extraction: true
      debug: true
      llm_service: gemini
      gemini:
        api_key: "AIzaSyAhOBn-pik-HO-jTvqLZ9oSshwBAp1duDg"
        model: "gemini-1.5-flash"
    type: marker

tasks:
  # ── Groq tasks (fast cloud inference) ─────────────────────────────────────
  reasoning:
    provider: groq
    model: deepseek-r1-distill-llama-70b
    params:
      temperature: 0.6
      max_tokens: 4096
    prompt_ref: reasoning/solve@v2
    timeout: 60

  reasoning_repair:
    provider: groq
    model: deepseek-r1-distill-llama-70b
    params:
      temperature: 0.6
      max_tokens: 4096
    prompt_ref: reasoning/repair@v1
    timeout: 60

  verification:
    provider: groq
    model: llama-3.3-70b-versatile
    params:
      temperature: 0.1
      max_tokens: 2048
    prompt_ref: codegen/baseline_codegen@v6
    timeout: 60
    max_repair_attempts: 3
    confidence_threshold: 0.95
    min_acceptable_confidence: 0.7
    repair_temperature: 0.2
    execution_timeout: 30
    memory_limit_mb: 512

  explain_step:
    provider: groq
    model: llama-3.3-70b-versatile
    params:
      temperature: 0.3
      max_tokens: 800
    prompt_ref: reasoning/explain_step@v1
    timeout: 30

  # ── Ollama tasks (local, vision-capable models) ────────────────────────────
  group_problems:
    provider: ollama_local
    model: qwen3:8b
    params:
      temperature: 0.1
      max_tokens: 4096
    prompt_ref: vision/group_problems@v3

  vision:
    provider: ollama_local
    model: qwen2.5vl:7b
    params:
      max_tokens: 1000
      temperature: 0.1
      top_p: 0.95
    prompt_ref: vision/analyze@v1

  validation:
    provider: ollama_local
    model: qwen2.5vl:7b
    params:
      temperature: 0.1
      max_tokens: 150
    prompt_ref: vision/validate@v1

  json_repair:
    provider: ollama_local
    model: qwen2.5vl:7b
    params:
      temperature: 0.1
      max_tokens: 2000
    prompt_ref: vision/repair_json@v1
